
services:
  # سرویس دیتابیس پروژه
  db:
    image: postgres:15-alpine
    container_name: retail_postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # سرویس بک‌اند جنگو (Gunicorn)
  web:
    build: .
    container_name: retail_django_web
    restart: always
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  # سرویس Nginx به عنوان reverse proxy
  nginx:
    image: nginx:alpine
    container_name: retail_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

  # ── سرویس cron برای ریست خودکار چک‌لیست‌ها ──────────────────
  cron:
    build: .
    container_name: retail_cron
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    command: sh /app/cron_runner.sh

volumes:
  postgres_data:
  static_volume:
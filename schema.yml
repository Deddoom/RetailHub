          type: array
          items:
            $ref: '#/components/schemas/WasteItemRequest'
      required:
      - branch
      - items
      - waste_date
    WasteReportStatusEnum:
      enum:
      - PENDING
      - APPROVED_BY_WAREHOUSE
      - REJECTED_BY_WAREHOUSE
      - CLOSED
      type: string
      description: |-
        * `PENDING` - در انتظار بررسی انباردار
        * `APPROVED_BY_WAREHOUSE` - تایید انباردار — در انتظار مدیریت
        * `REJECTED_BY_WAREHOUSE` - رد شده توسط انباردار
        * `CLOSED` - تعیین تکلیف توسط مدیریت
    WasteReviewRequestRequest:
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          description: |-
            تایید یا رد گزارش ضایعات

            * `approve` - approve
            * `reject` - reject
        comment:
          type: string
          description: توضیحات انباردار (اجباری در صورت رد)
      required:
      - action
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
tags:
- name: احراز هویت و دسترسی
  description: ورود به سیستم و دریافت توکن دسترسی بدون‌حالت (Stateless JWT)
- name: مدیریت کاربران
  description: مدیریت کاربران، نقش‌ها، حذف هوشمند (کامل/نرم)، بازیابی حساب، و ساختار
    سلسله‌مراتبی
- name: شعب
  description: لیست شعب معتبر و تغییر شعبه فعال کاربران
- name: مدیریت نقدینگی - کارت‌ها
  description: مدیریت ۹ کارت اختصاصی (تامین‌کننده، حقوق، اجاره، اقساط، سایر هزینه‌ها،
    مدیریت، پس‌انداز، خیریه، تجهیزات)، موجودی و تراکنش‌ها
- name: مدیریت نقدینگی - هزینه‌ها
  description: ثبت، لیست، فیلترهای هوشمند، تسویه نهایی با کسر خودکار از کارت، و پرداخت‌های
    مرحله‌ای
- name: مدیریت نقدینگی - درآمد روزانه
  description: تنظیم و دریافت تک‌مقدار درآمد روزانه کسب‌وکار جهت فرمول‌های محاسباتی
- name: مدیریت نقدینگی - شارژ روزانه
  description: ثبت و مشاهده لیست مبالغ شارژ شده روزانه نقدینگی به همراه تاریخ و ساعت
- name: فروش و فاکتورها
  description: ثبت و مدیریت فاکتورهای فروش، تسویه‌های نقدی، پوز، چکی و اتصال به بیعانه
- name: فروشندگان و پورسانت
  description: تعریف مدل‌های پورسانت، ثبت فروش‌های روزانه و استعلام جامع ماهانه فروشنده
- name: مشتریان
  description: مدیریت بانک اطلاعاتی مشتریان، سوابق خرید و جستجو
- name: هزینه‌های عمومی
  description: ثبت و مدیریت هزینه‌های عمومی فروشگاه، چک‌های صادره و تنخواه
- name: چک‌لیست‌ها و وظایف
  description: مدیریت و نظارت بر انجام وظایف و چک‌لیست‌های روزانه، هفتگی و ماهانه
    پرسنل
- name: ماموریت‌ها
  description: تعریف، تخصیص و پیگیری وضعیت ماموریت‌های اداری و عملیاتی پرسنل
- name: گزارش‌های دوره‌ای و مهلت‌دار
  description: تعریف الگوهای گزارش‌دهی و ارسال گزارش‌های متنی و تصویری کارکنان
- name: مساعده کارکنان
  description: فرآیند ثبت و تایید چندمرحله‌ای (سرپرست، ادمین، مدیر مالی) درخواست‌های
    مساعده
- name: خسارت و ضایعات
  description: ثبت خسارت‌ها و گزارش ضایعات اقلام و تاییدیه انباردار
- name: مطالبات و پیگیری‌ها
  description: ثبت مطالبات معوق، ثبت پیگیری‌ها و تعیین وضعیت تسویه
- name: برگشتی کالا و وجه
  description: درخواست‌های مرجوعی کالا، عودت وجه یا تعویض جنس
- name: حواله و انتقال بین شعب
  description: انتقال کالا بین شعب فروشگاه با تایید مبدا و مقصد
- name: سفارش‌های بیعانه
  description: مدیریت سفارش‌های همراه با بیعانه و تسویه در فاکتور نهایی
- name: انبار و خروج کالا
  description: ثبت و پیگیری خروج کالاهای امانی، نمونه و اداری از فروشگاه
- name: مدیریت فایل‌ها و رسانه
  description: سرویس آپلود تصاویر، اسناد، فاکتورها و مدارک با فرمت‌های مجاز

openapi: 3.0.3
info:
  title: RetailHub API
  version: 2.0.0
  description: مستندات تعاملی وب‌سرویس جامع مدیریت خرده‌فروشی و نقدینگی RetailHub
    (نسخه ۲.۰)
paths:
  /api/advance-requests/:
    get:
      operationId: advance_requests_list
      summary: لیست درخواست‌های مساعده من
      parameters:
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: از تاریخ ثبت (YYYY-MM-DD)
      - in: query
        name: status
        schema:
          type: string
        description: فیلتر وضعیت درخواست مساعده
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: تا تاریخ ثبت (YYYY-MM-DD)
      tags:
      - مساعده کارکنان
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdvanceRequestList'
          description: ''
    post:
      operationId: advance_requests_create
      summary: ثبت درخواست مساعده جدید
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceRequest'
          description: ''
  /api/advance-requests/{id}/:
    get:
      operationId: advance_requests_retrieve
      summary: مشاهده جزئیات کامل درخواست مساعده
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceRequest'
          description: ''
    put:
      operationId: advance_requests_update
      summary: ویرایش کامل درخواست مساعده
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvanceRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceRequest'
          description: ''
    patch:
      operationId: advance_requests_partial_update
      summary: ویرایش جزئی درخواست مساعده
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdvanceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdvanceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdvanceRequestRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvanceRequest'
          description: ''
    delete:
      operationId: advance_requests_destroy
      summary: حذف درخواست مساعده
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/advance-requests/{id}/admin-review/:
    post:
      operationId: advance_requests_admin_review_create
      summary: بررسی و تایید یا رد درخواست مساعده توسط مدیریت (ادمین)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/advance-requests/{id}/finance-pay/:
    post:
      operationId: advance_requests_finance_pay_create
      summary: ثبت واریز و پرداخت نهایی مساعده توسط مدیر مالی
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvancePayRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvancePayRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvancePayRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/advance-requests/{id}/superior-review/:
    post:
      operationId: advance_requests_superior_review_create
      summary: بررسی و تایید یا رد درخواست مساعده توسط بالادستی
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این advance request را شناسایی میکند.
        required: true
      tags:
      - مساعده کارکنان
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvanceReviewRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/advance-requests/admin-list/:
    get:
      operationId: advance_requests_admin_list_list
      description: |-
        لیست کامل درخواست‌های مساعده برای ادمین و مدیر مالی.
        پشتیبانی از فیلترهای: status, from_date, to_date, search (نام/یوزرنیم), superior_id, requester_id
      summary: لیست جامع کلیه درخواست‌های مساعده سیستم جهت مدیریت و مالی
      parameters:
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: از تاریخ ثبت (YYYY-MM-DD)
      - in: query
        name: requester_id
        schema:
          type: string
          format: uuid
        description: شناسه کاربر متقاضی
      - in: query
        name: search
        schema:
          type: string
        description: جستجو در نام یا نام کاربری
      - in: query
        name: status
        schema:
          type: string
        description: فیلتر وضعیت
      - in: query
        name: superior_id
        schema:
          type: string
          format: uuid
        description: شناسه کاربر بالادستی
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: تا تاریخ ثبت (YYYY-MM-DD)
      tags:
      - مساعده کارکنان
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdvanceRequestInbox'
          description: ''
  /api/advance-requests/my-inbox/:
    get:
      operationId: advance_requests_my_inbox_list
      description: |-
        کارتابل اختصاصی بالادستی:
        فقط درخواست‌هایی که target_superior=me هستند برمی‌گردد.
        این endpoint برای بالادستی‌ها طراحی شده تا «inbox» خود را ببینند.
      summary: کارتابل درخواست‌های مساعده ارجاع‌شده به کاربر جاری (بالادستی)
      parameters:
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: از تاریخ ثبت (YYYY-MM-DD)
      - in: query
        name: search
        schema:
          type: string
        description: جستجو در نام یا نام کاربری
      - in: query
        name: status
        schema:
          type: string
        description: فیلتر وضعیت
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: تا تاریخ ثبت (YYYY-MM-DD)
      tags:
      - مساعده کارکنان
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdvanceRequestInbox'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: ورود با نام کاربری یا شماره موبایل و رمز عبور. در صورت صحت اطلاعات،
        توکن دسترسی Stateless JWT و مشخصات نقش و کاربر بازگردانده می‌شود.
      summary: ورود به سیستم و دریافت توکن JWT
      tags:
      - احراز هویت و دسترسی
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthLoginRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/branches/:
    get:
      operationId: branches_list
      description: دریافت لیست تمام شعب معتبر و ثبت‌شده در سیستم جهت استفاده در فیلترها
        و فرم‌های انتخاب شعبه.
      summary: لیست شعب تعریف‌شده در سیستم
      tags:
      - شعب
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchItem'
          description: ''
  /api/checklist-logs/:
    get:
      operationId: checklist_logs_list
      summary: لیست لاگ‌ها و تاریخچه انجام چک‌لیست‌ها
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
          format: uuid
        description: فیلتر بر اساس شناسه کاربر مسئول
      - in: query
        name: frequency
        schema:
          type: string
        description: فیلتر بر اساس دوره تناوب (DAILY, WEEKLY, MONTHLY)
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: از تاریخ بازه (YYYY-MM-DD)
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: تا تاریخ بازه (YYYY-MM-DD)
      tags:
      - چک‌لیست‌ها و وظایف
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChecklistLog'
          description: ''
  /api/checklist-logs/{id}/:
    get:
      operationId: checklist_logs_retrieve
      summary: مشاهده جزئیات لاگ چک‌لیست
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این checklist log را شناسایی میکند.
        required: true
      tags:
      - چک‌لیست‌ها و وظایف
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistLog'
          description: ''
  /api/checklists/:
    get:
      operationId: checklists_list
      summary: لیست چک‌لیست‌ها
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
          format: uuid
        description: فیلتر بر اساس کاربر مسئول
      tags:
      - چک‌لیست‌ها و وظایف
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Checklist'
          description: ''
    post:
      operationId: checklists_create
      summary: تعریف چک‌لیست جدید
      tags:
      - چک‌لیست‌ها و وظایف
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
  /api/checklists/{id}/:
    get:
      operationId: checklists_retrieve
      summary: مشاهده جزئیات چک‌لیست
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این checklist را شناسایی میکند.
        required: true
      tags:
      - چک‌لیست‌ها و وظایف
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
    put:
      operationId: checklists_update
      summary: ویرایش کامل چک‌لیست
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این checklist را شناسایی میکند.
        required: true
      tags:
      - چک‌لیست‌ها و وظایف
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChecklistRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
    patch:
      operationId: checklists_partial_update
      summary: ویرایش جزئی چک‌لیست
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این checklist را شناسایی میکند.
        required: true
      tags:
      - چک‌لیست‌ها و وظایف
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChecklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChecklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChecklistRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
          description: ''
    delete:
      operationId: checklists_destroy
      summary: حذف چک‌لیست
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این checklist را شناسایی میکند.
        required: true
      tags:
      - چک‌لیست‌ها و وظایف
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/claims/:
    get:
      operationId: claims_list
      summary: لیست مطالبات معوق
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
          format: uuid
        description: فیلتر بر اساس کاربر پیگیری‌کننده
      - in: query
        name: status
        schema:
          type: string
        description: فیلتر بر اساس وضعیت مطالبه
      tags:
      - مطالبات و پیگیری‌ها
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
          description: ''
    post:
      operationId: claims_create
      summary: ثبت پرونده مطالبه جدید
      tags:
      - مطالبات و پیگیری‌ها
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/claims/{id}/:
    get:
      operationId: claims_retrieve
      summary: مشاهده جزئیات مطالبه و پیگیری‌ها
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این claim را شناسایی میکند.
        required: true
      tags:
      - مطالبات و پیگیری‌ها
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    put:
      operationId: claims_update
      summary: ویرایش کامل پرونده مطالبه
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این claim را شناسایی میکند.
        required: true
      tags:
      - مطالبات و پیگیری‌ها
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    patch:
      operationId: claims_partial_update
      summary: ویرایش جزئی پرونده مطالبه
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این claim را شناسایی میکند.
        required: true
      tags:
      - مطالبات و پیگیری‌ها
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    delete:
      operationId: claims_destroy
      summary: حذف پرونده مطالبه
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این claim را شناسایی میکند.
        required: true
      tags:
      - مطالبات و پیگیری‌ها
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/claims/{id}/add-follow-up/:
    post:
      operationId: claims_add_follow_up_create
      summary: ثبت اقدام پیگیری جدید برای یک مطالبه
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid

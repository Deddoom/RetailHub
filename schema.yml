            نمونه ساختار ارسالی (فرانت‌اند فقط id و answer را می‌فرستد):
            ```json
            [
              {"question_id": "q1", "answer": "پاسخ اول"},
              {"question_id": "q2", "answer": "پاسخ دوم"}
